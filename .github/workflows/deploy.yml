name: Deploy LYFEAPP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lyfeapp-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH key
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.DEPLOY_SSH_KEY_B64 }}" | base64 -d | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Create rollback snapshot on server
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "$DEPLOY_PORT" -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -se" <<'EOF'
            set -Eeuo pipefail
            cd "$DEPLOY_PATH"

            mkdir -p runtime/ops

            test -d /var/backups/lyfeapp/releases
            test -w /var/backups/lyfeapp/releases

            CURRENT_SHA="unknown"

            if [ -f runtime/ops/last_deploy.json ]; then
              cp runtime/ops/last_deploy.json runtime/ops/previous_deploy.json || true
              chmod 600 runtime/ops/previous_deploy.json || true

              CURRENT_SHA="$(python3 -c 'import json, pathlib; p=pathlib.Path("runtime/ops/last_deploy.json"); print((json.loads(p.read_text(encoding="utf-8")).get("git_sha") if p.exists() else "unknown"))' 2>/dev/null || echo unknown)"
            fi

            RELEASE_TS="$(date -u +%Y%m%d_%H%M%S)"
            RELEASE_ARCHIVE="/var/backups/lyfeapp/releases/lyfeapp_release_${RELEASE_TS}_${CURRENT_SHA}.tar.gz"

            tar \
              --exclude='./.git' \
              --exclude='./.venv' \
              --exclude='./.env' \
              --exclude='./.env.*' \
              --exclude='./media' \
              --exclude='./staticfiles' \
              --exclude='./runtime' \
              --exclude='./scripts' \
              --exclude='./__pycache__' \
              --exclude='./.pytest_cache' \
              --exclude='./.mypy_cache' \
              --exclude='./node_modules' \
              -czf "$RELEASE_ARCHIVE" \
              .

            chmod 600 "$RELEASE_ARCHIVE"

            CREATED_AT="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            printf '{\n  "status": "ok",\n  "created_at_utc": "%s",\n  "source_git_sha": "%s",\n  "archive_path": "%s"\n}\n' \
              "$CREATED_AT" \
              "$CURRENT_SHA" \
              "$RELEASE_ARCHIVE" \
              > runtime/ops/last_release_backup.json

            chmod 600 runtime/ops/last_release_backup.json || true

            ls -1t /var/backups/lyfeapp/releases/lyfeapp_release_*.tar.gz 2>/dev/null | tail -n +11 | xargs -r rm -f
          EOF

      - name: Sync project to server
        shell: bash
        run: |
          set -Eeuo pipefail
          rsync -az --delete \
            --exclude-from=.deployignore \
            -e "ssh -i ~/.ssh/id_ed25519 -p $DEPLOY_PORT -o IdentitiesOnly=yes" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Run deploy commands on server
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "$DEPLOY_PORT" -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_PATH='$DEPLOY_PATH' GIT_SHA='${{ github.sha }}' bash -se" <<'EOF'
            set -Eeuo pipefail
            cd "$DEPLOY_PATH"

            dump_debug() {
              echo "==== docker compose ps ===="
              docker compose ps || true
              echo "==== web logs ===="
              docker compose logs --tail=100 web || true
              echo "==== worker logs ===="
              docker compose logs --tail=100 worker || true
              echo "==== db logs ===="
              docker compose logs --tail=100 db || true
              echo "==== redis logs ===="
              docker compose logs --tail=100 redis || true
            }

            trap 'dump_debug' ERR

            docker compose up -d db redis
            docker compose build web
            docker compose run --rm --interactive=false -T web python manage.py check
            docker compose run --rm --interactive=false -T web python manage.py check --deploy
            docker compose run --rm --interactive=false -T web python manage.py migrate --noinput
            docker compose run --rm --interactive=false -T web python manage.py collectstatic --noinput
            docker compose up -d web worker

            HEALTH_URL="https://lyfeapp.cz/health/"
            HEALTH_OK="false"

            for attempt in $(seq 1 12); do
              if HEALTH_OUTPUT="$(curl -fsS "$HEALTH_URL")"; then
                echo "Health OK: $HEALTH_OUTPUT"
                HEALTH_OK="true"
                break
              fi

              echo "Health check attempt $attempt/12 failed, retrying in 5s..."
              sleep 5
            done

            if [ "$HEALTH_OK" != "true" ]; then
              echo "Health check failed after all retries."
              exit 1
            fi

            mkdir -p runtime/ops
            CREATED_AT="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"

            printf '{\n  "status": "ok",\n  "created_at_utc": "%s",\n  "git_sha": "%s"\n}\n' \
              "$CREATED_AT" \
              "$GIT_SHA" \
              > runtime/ops/last_deploy.json

            chmod 600 runtime/ops/last_deploy.json || true

            docker compose ps
            docker compose logs --tail=50 web
            docker compose logs --tail=50 worker
          EOF
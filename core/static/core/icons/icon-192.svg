<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&amp;display=swap');
      .elegant-text {
        font-family: 'Great Vibes', cursive;
        font-size: 85px;
        fill: url(#textGradient);
        text-anchor: middle;
        filter: url(#dropShadow);
      }
    </style>
    
    <linearGradient id="bgGradient192" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3e45" />
      <stop offset="100%" stop-color="#16191d" />
    </linearGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0e0e0" />
      <stop offset="100%" stop-color="#8a8d91" />
    </linearGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="192" height="192" rx="42" fill="url(#bgGradient192)"/>
  
  <text x="96" y="122" class="elegant-text">lyfe</text>
</svg>

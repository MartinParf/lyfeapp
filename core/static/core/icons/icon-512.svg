<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&amp;display=swap');
      .elegant-text-large {
        font-family: 'Great Vibes', cursive;
        font-size: 230px;
        fill: url(#textGradientLarge);
        text-anchor: middle;
        filter: url(#dropShadowLarge);
      }
    </style>
    
    <linearGradient id="bgGradient512" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3e45" />
      <stop offset="100%" stop-color="#16191d" />
    </linearGradient>

    <linearGradient id="textGradientLarge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0e0e0" />
      <stop offset="100%" stop-color="#8a8d91" />
    </linearGradient>

    <filter id="dropShadowLarge" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGradient512)"/>
  
  <text x="256" y="325" class="elegant-text-large">lyfe</text>
</svg>

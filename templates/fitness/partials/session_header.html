<div id="session-header" class="list-card panel-soft">
    <h2>Session Header</h2>

    <form
        method="post"
        hx-post="{% url 'fitness:htmx-session-update-header' session.pk %}"
        hx-target="#session-header"
        hx-swap="outerHTML"
        class="preserve-scroll form-shell"
    >
        {% csrf_token %}

        <div class="form-section panel-soft">
            <h3 class="form-section-title">Header Data</h3>

            {% for field in header_form %}
                <div class="form-row">
                    <div>{{ field.label_tag }}</div>
                    <div>{{ field }}</div>
                    {% if field.help_text %}
                        <div class="form-help">{{ field.help_text }}</div>
                    {% endif %}
                    {{ field.errors }}
                </div>
            {% endfor %}
        </div>

        <div class="form-actions">
            <button type="submit" class="primary-button">Save header</button>
        </div>
    </form>

    <div class="list-card panel-soft" style="margin-top: 8px;">
        <div class="meta-item-label" style="margin-bottom: 6px;">Session actions</div>

        <div class="action-group">
            <form
                method="post"
                action="{% url 'fitness:session-clone' session.pk %}"
            >
                {% csrf_token %}
                <button type="submit">Clone session</button>
            </form>

            <form
                method="post"
                action="{% url 'fitness:session-delete' session.pk %}"
                onsubmit="return confirm('Delete this workout session?');"
            >
                {% csrf_token %}
                <button type="submit" class="danger">Delete session</button>
            </form>
        </div>
    </div>
</div>

<div class="list-card session-list-card {% if session.is_ui_planned %}session-list-card-planned{% else %}session-list-card-completed{% endif %}">
    <div class="session-list-card-top">
        <div class="session-list-card-main">
            <div class="session-list-title-row">
                <div class="list-card-title session-list-title">Session #{{ session.id }}</div>
                <span class="session-inline-state" title="{{ session.ui_status|title }}">
                    <span class="material-symbols-rounded session-state-icon">
                        {% if session.is_ui_completed %}check_circle{% else %}event{% endif %}
                    </span>
                </span>
            </div>

            <div class="session-list-date-line">{{ session.effective_date|date:"d.m.Y" }}</div>
        </div>

        <div class="session-focus-chip">{{ session.get_focus_display }}</div>
    </div>

    <div class="session-list-card-bottom">
        <div class="session-icon-actions">
            <a
                href="{% url 'fitness:session-detail' session.pk %}"
                class="icon-button"
                aria-label="Open session"
                title="Open"
            >
                <span class="material-symbols-rounded">arrow_forward</span>
            </a>

            <form method="post" action="{% url 'fitness:session-clone' session.pk %}">
                {% csrf_token %}
                <button
                    type="submit"
                    class="icon-button"
                    aria-label="Clone session"
                    title="Clone"
                >
                    <span class="material-symbols-rounded">content_copy</span>
                </button>
            </form>

            <form
                method="post"
                action="{% url 'fitness:session-delete' session.pk %}"
                onsubmit="return confirm('Delete this workout session?');"
            >
                {% csrf_token %}
                <button
                    type="submit"
                    class="icon-button icon-button-danger"
                    aria-label="Delete session"
                    title="Delete"
                >
                    <span class="material-symbols-rounded">delete</span>
                </button>
            </form>
        </div>

        <div class="session-duration-kpi">
            <div class="session-duration-label">Duration</div>
            <div class="session-duration-value">{{ session.duration_label }}</div>
        </div>
    </div>
</div>

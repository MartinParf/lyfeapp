<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LYFE — Password reset</title>
</head>
<body>
  <h1>Password reset</h1>
  <p>Enter the email address for your account. If it exists, we will send a reset link.</p>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Send reset link</button>
  </form>
</body>
</html>

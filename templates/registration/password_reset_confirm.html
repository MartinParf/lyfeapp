<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LYFE — Choose new password</title>
</head>
<body>
  <h1>Choose a new password</h1>

  {% if validlink %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Set new password</button>
    </form>
  {% else %}
    <p>This reset link is invalid or expired.</p>
  {% endif %}
</body>
</html>
